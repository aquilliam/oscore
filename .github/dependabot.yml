version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql-action:
        patterns: ["github/codeql-action/*"]
    ignore:
      - dependency-name: ossf/scorecard-action
        versions: ["2.6.0"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
