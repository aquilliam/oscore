version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql-action:
        patterns: ["github/codeql-action/*"]
    ignore:
      - dependency-name: ossf/scorecard-action
        versions: ["2.6.0"]
  - package-ecosystem: gomod
    directories: [/, /interop]
    allow:
      - dependency-type: direct
      - dependency-name: golang.org/x/crypto
        dependency-type: all
      - dependency-name: github.com/pion/dtls/v4
        dependency-type: all
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
